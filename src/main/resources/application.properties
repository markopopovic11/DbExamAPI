spring.application.name=DbExamAPI

# Local overrides from .env in the working directory (git-ignored)
spring.config.import=optional:file:.env[.properties]

# Metadata database (override via env vars in other environments)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dbexam}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Schema is owned by Flyway migrations, never by Hibernate
spring.jpa.hibernate.ddl-auto=none

# Existing databases predate Flyway: baseline them at 0 so V1+ still apply
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# JWT (defaults are dev-only; override both secrets in any real environment)
application.security.jwt.access-secret=${JWT_ACCESS_SECRET:g/oENMwDE7dPj1VLBZGVZA49KDvAyHF0tN3pC29VaEg=}
application.security.jwt.refresh-secret=${JWT_REFRESH_SECRET:bjhnjifEor64QaPKYAnnJbdlx7G8P4OgeYxllviZf28=}
application.security.jwt.access-expiration-minutes=30
application.security.jwt.refresh-expiration-days=30

# CORS
application.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Cloudflare R2 (S3 API) for uploaded document files. Keys come from .env or env vars
application.storage.r2.account-id=${R2_ACCOUNT_ID:73d6b1a5c018f2242ae31a9f73c053d3}
application.storage.r2.bucket=${R2_BUCKET:db-exam}
application.storage.r2.access-key-id=${R2_ACCESS_KEY_ID:}
application.storage.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}

# Uploads: dataset version seeds can hold thousands of INSERTs
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:25MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_SIZE:25MB}
